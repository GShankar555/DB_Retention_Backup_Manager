{% macro icon(name, size=16) -%}

  {% elif name == 'moon' %}<path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>
  {% elif name == 'logout' %}<path d="M10 17l5-5-5-5M15 12H3M21 4v16"/>
  {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'download' %}<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
  {% elif name == 'arrow-left' %}<path d="m15 18-6-6 6-6M9 12h12"/>
  {% elif name == 'arrow-up-right' %}<path d="M7 17 17 7M8 7h9v9"/>
  {% elif name == 'play' %}<path d="m8 5 11 7-11 7V5Z"/>
  {% elif name == 'history' %}<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 7v5l3 2"/>
  {% elif name == 'edit' %}<path d="m4 16.5-.8 3.3 3.3-.8L18 7.5 15.5 5 4 16.5Z"/><path d="m14 6.5 2.5 2.5"/>
  {% elif name == 'trash' %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>
  {% elif name == 'refresh' %}<path d="M20 11a8 8 0 0 0-14.7-4L3 9M3 4v5h5M4 13a8 8 0 0 0 14.7 4L21 15M21 20v-5h-5"/>

  {% elif name == 'warning' %}<path d="m12 3 9 17H3L12 3Z"/><path d="M12 9v4M12 16h.01"/>

  {% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
  {% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {% elif name == 'server' %}<rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M8 7h.01M8 17h.01"/>

</svg>
