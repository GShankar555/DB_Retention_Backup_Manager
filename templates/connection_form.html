{% extends 'base.html' %}
{% block content %}
<div class="page-header compact-header"><div><p class="eyebrow"><i></i> EDIT CONNECTION</p><h1>{{ connection['name'] }}</h1><p class="subtitle">Update credentials or network details for this source database.</p></div><a class="button secondary" href="{{ url_for('connections') }}">← &nbsp;Back to connections</a></div>
<section class="card form-card edit-connection-card"><div class="card-heading"><div><h2>Connection details</h2><p>Leave the password empty to keep the current password.</p></div></div><form method="post" class="form-grid" id="edit-connection-form"><label>Name<input name="name" required value="{{ form.get('name','') }}"></label><label>Database engine<select name="engine"><option {% if form.get('engine') == 'PostgreSQL' %}selected{% endif %}>PostgreSQL</option><option {% if form.get('engine') == 'MySQL' %}selected{% endif %}>MySQL</option><option {% if form.get('engine') == 'MariaDB' %}selected{% endif %}>MariaDB</option><option {% if form.get('engine') == 'SQL Server' %}selected{% endif %}>SQL Server</option><option {% if form.get('engine') == 'MongoDB' %}selected{% endif %}>MongoDB</option></select></label><label>Host<input name="host" required value="{{ form.get('host','') }}"></label><label>Port<input name="port" type="number" required value="{{ form.get('port',5432) }}"></label><label>Database name<input name="database_name" required value="{{ form.get('database_name','') }}"></label><label>Username<input name="username" required value="{{ form.get('username','') }}"></label><label>Password<input name="password" type="password" placeholder="Leave blank to keep current"></label><label>SSL mode<select name="ssl_mode"><option value="require" {% if form.get('ssl_mode') == 'require' %}selected{% endif %}>Require</option><option value="verify-full" {% if form.get('ssl_mode') == 'verify-full' %}selected{% endif %}>Verify full</option><option value="disable" {% if form.get('ssl_mode') == 'disable' %}selected{% endif %}>Disable</option></select></label><div class="form-submit"><button class="button secondary test-connection-form" type="button" data-connection-id="{{ connection['id'] }}">Test saved connection</button><button class="button primary" type="submit">Save changes</button></div></form></section>
{% endblock %}
